version: '3.8'

services:
  web:
    build: .
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=prod-django-secret-key-change-this
      - DATABASE_URL=postgres://pintureria_user:pintureria_pass@db:5432/pintureriadb
      - ALLOWED_HOSTS=*
      - RESEND_API_KEY=${RESEND_API_KEY}
      - EMAIL_SENDER=${EMAIL_SENDER}
      - EMAIL_RECEIVER=${EMAIL_RECEIVER}
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=pintureriadb
      - POSTGRES_USER=pintureria_user
      - POSTGRES_PASSWORD=pintureria_pass
    ports:
      - "5432:5432"

volumes:
  postgres_data:
