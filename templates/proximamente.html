{% load static %}
<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Bauhaus Recubrimientos Técnicos — Próximamente</title>
    <meta name="description" content="Próximamente nuevo sitio web de Bauhaus Pinturería Técnica Industrial. Asesoramiento técnico y soluciones en recubrimientos de alto rendimiento. Córdoba, Argentina.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{% static 'images/favicon.png' %}">
    
    <!-- Google Fonts: Rethink Sans (Manual de Marca Bauhaus) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rethink+Sans:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Rethink Sans"', 'sans-serif'],
                    },
                    colors: {
                        brandDark: '#000c1b',
                        brandYellow: '#e7b924',
                        brandBlue: '#007ab4',
                    }
                }
            }
        }
    </script>
    <style>
        html, body {
            min-height: 100%;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }
    </style>
</head>
<body class="min-h-screen bg-white text-[#000c1b] font-sans flex flex-col justify-between items-center selection:bg-[#e7b924] selection:text-black p-0 m-0">

    <main class="w-full flex-1 flex flex-col items-center justify-center px-4 py-8 sm:py-12">
        <div class="w-full max-w-4xl flex flex-col items-center justify-center text-center">
            
            <!-- Flyer Principal en 4K (Sin bordes, sin tarjetas, sin botones) -->
            <div class="w-full flex items-center justify-center">
                <img 
                    src="{% static 'images/proximamente.png' %}?v=3" 
                    alt="Bauhaus Pinturería Técnica Industrial - Próximamente Nuevo Sitio Web" 
                    class="w-full max-w-2xl h-auto max-h-[66vh] object-contain mx-auto select-none"
                >
            </div>

            <!-- Links Interactivos (Como texto y enlaces reales, sin formato de tarjeta ni banners de botón) -->
            <div class="mt-6 sm:mt-8 flex flex-col items-center gap-3 sm:gap-4 text-xs sm:text-sm md:text-base font-semibold text-[#000c1b]">
                
                <!-- Link a Google Maps (Ubicación del Local) -->
                <a 
                    href="https://maps.google.com/?q=BAUHAUS+Pintura+Epoxi" 
                    target="_blank" 
                    rel="noopener noreferrer" 
                    class="inline-flex items-center gap-2 text-gray-800 hover:text-[#007ab4] hover:underline decoration-2 underline-offset-4 transition duration-200 group"
                >
                    <svg class="w-4 h-4 sm:w-5 sm:h-5 text-red-600 fill-current shrink-0 group-hover:scale-110 transition-transform" viewBox="0 0 24 24">
                        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
                    </svg>
                    <span>Recta Martinolli 8197, Argüello, Córdoba</span>
                    <span class="text-xs text-gray-400 group-hover:text-[#007ab4] transition-colors">(Ver en Google Maps ↗)</span>
                </a>

                <!-- Logos de Contacto y Redes: Instagram y WhatsApp alineados a la misma altura -->
                <div class="flex items-center justify-center gap-6 pt-1">
                    <!-- Instagram Logo -->
                    <a 
                        href="https://www.instagram.com/bauhauspinturerias/" 
                        target="_blank"

                    >

                            <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>

                    </a>

                    <!-- WhatsApp Logo -->
                    <a 
                        href="https://wa.me/5493516325978?text=Hola!%20Te%20contacto%20desde%20el%20sitio%20web%20de%20Bauhaus."
                        target="_blank" 
                        rel="noopener noreferrer" 
                        title="WhatsApp (+54 9 351 632-5978)"
                        aria-label="WhatsApp"
                        class="text-[#25D366] hover:scale-115 transition-transform duration-200 inline-flex items-center justify-center"
                    >
                        <svg class="w-7 h-7 sm:w-8 sm:h-8 fill-current" viewBox="0 0 24 24">
                            <path d="M12.012 0C5.384 0 0 5.384 0 12.012c0 2.116.551 4.179 1.6 5.99L.05 24l6.155-1.614A11.96 11.96 0 0 0 12.012 24c6.628 0 12.012-5.384 12.012-12.012S18.64 0 12.012 0zm0 21.986c-1.802 0-3.567-.482-5.11-1.393l-.367-.218-3.794.995 1.012-3.698-.24-.381A9.972 9.972 0 0 1 2.028 12.01c0-5.505 4.48-9.985 9.984-9.985 5.505 0 9.985 4.48 9.985 9.985 0 5.504-4.48 9.986-9.985 9.986zm5.474-7.482c-.3-.15-1.776-.876-2.052-.976-.276-.1-.476-.15-.676.15-.2.3-.776.976-.951 1.176-.175.2-.351.225-.651.075-.3-.15-1.266-.467-2.41-1.488-.891-.795-1.492-1.777-1.667-2.077-.175-.3-.019-.462.13-.611.135-.134.3-.35.45-.525.15-.175.2-.3.3-.5.1-.2.05-.375-.025-.525-.075-.15-.676-1.63-.926-2.232-.244-.585-.494-.505-.676-.514-.175-.008-.376-.01-.576-.01s-.525.075-.801.375c-.275.3-1.05 1.026-1.05 2.502 0 1.476 1.075 2.901 1.225 3.101.15.2 2.115 3.23 5.126 4.53 1.25.54 1.77.63 2.428.525.75-.12 1.776-.726 2.026-1.426.25-.7.25-1.301.175-1.426-.075-.125-.275-.2-.575-.35z"/>
                        </svg>
                    </a>
                </div>

            </div>

        </div>
    </main>

    <!-- Barra de Navegación SOLO PARA HOST LOCAL (Visible únicamente en 127.0.0.1 / localhost) -->
    <div id="dev-local-toolbar" class="hidden fixed bottom-4 inset-x-0 mx-auto max-w-md z-50 px-4">
        <div class="bg-[#000c1b] text-white p-2.5 rounded-2xl shadow-2xl border-2 border-[#e7b924] flex items-center justify-between gap-2 text-xs">
            <span class="font-bold text-[#e7b924] uppercase tracking-wider flex items-center gap-1.5 text-[11px]">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                Host Local:
            </span>
            <div class="flex items-center gap-1.5">
                <a href="/inicio/" class="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-[#e7b924] hover:text-black font-bold transition text-[11px]">
                    Inicio
                </a>
                <a href="/aplicadores/" class="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-[#e7b924] hover:text-black font-bold transition text-[11px]">
                    Aplicadores
                </a>
                <a href="/industria/" class="px-2.5 py-1 rounded-lg bg-white/10 hover:bg-[#e7b924] hover:text-black font-bold transition text-[11px]">
                    Industria
                </a>
            </div>
        </div>
    </div>

    <script>
        // Muestra la barra de navegación ÚNICAMENTE si estás en tu máquina local
        if (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') {
            const bar = document.getElementById('dev-local-toolbar');
            if (bar) bar.classList.remove('hidden');
        }
    </script>
</body>
</html>
